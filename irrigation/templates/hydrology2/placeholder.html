{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi {{ icon }}"></i> {{ title }}</h2>
    <a href="{{ url_for('project.detail', project_id=project.id) }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Back / رجوع
    </a>
</div>

<div class="mb-3">
    <span class="badge bg-primary"><i class="bi bi-folder"></i> {{ project.name }}</span>
</div>

<div class="alert alert-info text-center py-5">
    <i class="bi bi-tools display-1 text-muted"></i>
    <h3 class="mt-3">{{ title }}</h3>
    <p class="text-muted">This feature is under development and will be available soon.</p>
    <p class="text-muted">هذه الميزة قيد التطوير وستتوفر قريباً.</p>
    <hr class="my-4">
    <a href="{{ url_for('hydrology.valves', project_id=project.id) }}" class="btn btn-primary">
        <i class="bi bi-valve"></i> Go to Valves / الذهاب للصمامات
    </a>
</div>
{% endblock %}
